name: driver_app
description: "Clay Driver App"
publish_to: 'none'
version: 1.0.0+1

resolution: workspace
environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  clay_shared:
    path: ../../packages/clay_shared
  clay_ui:
    path: ../../packages/clay_ui
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

