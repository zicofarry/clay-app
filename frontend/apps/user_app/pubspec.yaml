name: user_app
description: "Clay User App - Gojek-like customer application"
publish_to: 'none'
version: 1.0.0+1

resolution: workspace
environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  clay_shared:
    path: ../../packages/clay_shared
  clay_ui:
    path: ../../packages/clay_ui
  dio: ^5.9.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  flutter_map: ^7.0.2
  geolocator: ^13.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/promo/
