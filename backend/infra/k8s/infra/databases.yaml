# ─────────────────────────────────────────────────────────────────────────────
# Clay Platform — Consolidated Database Infrastructure for AKS
# 1 Postgres (multi-db), 1 Redis (shared), 1 MongoDB (multi-db),
# Kafka + Zookeeper, Elasticsearch
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# POSTGRES — Single instance, multiple databases via init script
# ═══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: clay
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    for db in clay_auth clay_user clay_payment clay_notification clay_geo \
              clay_merchant clay_pricing clay_promotion clay_rating \
              clay_ride_order clay_food_order clay_delivery_order \
              clay_security clay_sms clay_email clay_wallet clay_history; do
      echo "Creating database: $db"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE $db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
      EOSQL
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: clay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: clay
            - name: POSTGRES_PASSWORD
              value: clay
            - name: POSTGRES_DB
              value: clay_auth
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clay
spec:
  ports:
    - port: 5432
  selector:
    app: postgres

